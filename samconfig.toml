version = 0.1

# Local `sam` commands use the [default] environment. The GitHub Actions pipeline
# passes --config-env ci (not defined here) so none of these values apply in CI;
# it supplies stack, bucket, role and parameters explicitly per stage.

[default.global.parameters]
stack_name = "serverless-todo-dev"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "eu-west-1"
parameter_overrides = "Stage=dev"

[default.sync.parameters]
watch = true
