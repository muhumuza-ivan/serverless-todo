# Generated by `sam pipeline init` (GitHub Actions two-stage template, OIDC) from the
# resources created by `sam pipeline bootstrap --stage dev|prod`, then adapted for this
# project: Java 21 build and unit tests, a post-deployment integration test, explicit
# per-stage parameters, and a manual approval before production.
name: Pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  SAM_TEMPLATE: template.yaml
  # Local samconfig.toml settings are for developer machines; CI uses an empty config env
  # and passes everything explicitly.
  SAM_CONFIG_ENV: ci
  TESTING_STACK_NAME: serverless-todo-dev
  TESTING_PIPELINE_EXECUTION_ROLE: arn:aws:iam::765812221756:role/aws-sam-cli-managed-dev-pipel-PipelineExecutionRole-dYkUYzMnzB0j
  TESTING_CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::765812221756:role/aws-sam-cli-managed-dev-p-CloudFormationExecutionRo-FfJohSCVEYBb
  TESTING_ARTIFACTS_BUCKET: aws-sam-cli-managed-dev-pipeline-r-artifactsbucket-syrqtdnldf3f
  TESTING_REGION: eu-west-1
  TESTING_PARAMETERS: Stage=dev
  PROD_STACK_NAME: serverless-todo-prod
  PROD_PIPELINE_EXECUTION_ROLE: arn:aws:iam::765812221756:role/aws-sam-cli-managed-prod-pipe-PipelineExecutionRole-5jAgqbc2063Q
  PROD_CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::765812221756:role/aws-sam-cli-managed-prod--CloudFormationExecutionRo-DS7h6k9hZEkG
  PROD_ARTIFACTS_BUCKET: aws-sam-cli-managed-prod-pipeline--artifactsbucket-dedd6dhlnzoz
  PROD_REGION: eu-west-1
  PROD_PARAMETERS: Stage=prod

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: mvn -B -f backend/pom.xml verify

  build-and-package:
    name: Build and package
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # The Java jar is architecture-independent, so no build container is needed
      # for the arm64 functions.
      - name: Build resources
        run: sam build --template ${SAM_TEMPLATE} --config-env ${SAM_CONFIG_ENV}

      - name: Assume the testing pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.TESTING_REGION }}
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          role-session-name: testing-packaging
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Upload artifacts to testing artifact buckets
        run: |
          sam package \
            --config-env ${SAM_CONFIG_ENV} \
            --s3-bucket ${TESTING_ARTIFACTS_BUCKET} \
            --region ${TESTING_REGION} \
            --output-template-file packaged-testing.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-testing.yaml
          path: packaged-testing.yaml

      - name: Assume the prod pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.PROD_REGION }}
          role-to-assume: ${{ env.PROD_PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-packaging
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Upload artifacts to production artifact buckets
        run: |
          sam package \
            --config-env ${SAM_CONFIG_ENV} \
            --s3-bucket ${PROD_ARTIFACTS_BUCKET} \
            --region ${PROD_REGION} \
            --output-template-file packaged-prod.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-prod.yaml
          path: packaged-prod.yaml

  deploy-testing:
    name: Deploy dev
    if: github.ref == 'refs/heads/main'
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: actions/download-artifact@v4
        with:
          name: packaged-testing.yaml

      - name: Assume the testing pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.TESTING_REGION }}
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          role-session-name: testing-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Deploy to testing account
        run: |
          sam deploy --stack-name ${TESTING_STACK_NAME} \
            --config-env ${SAM_CONFIG_ENV} \
            --template packaged-testing.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${TESTING_REGION} \
            --s3-bucket ${TESTING_ARTIFACTS_BUCKET} \
            --parameter-overrides ${TESTING_PARAMETERS} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --role-arn ${TESTING_CLOUDFORMATION_EXECUTION_ROLE}

  integration-test:
    name: Integration test (dev)
    if: github.ref == 'refs/heads/main'
    needs: [deploy-testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the testing pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.TESTING_REGION }}
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          role-session-name: testing-integration
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Auth, CRUD and expiry checks against the dev stack
        run: tests/integration/smoke.sh ${TESTING_STACK_NAME} ${TESTING_REGION}

  deploy-prod:
    name: Deploy prod
    if: github.ref == 'refs/heads/main'
    needs: [integration-test]
    runs-on: ubuntu-latest
    # Manual approval: the "production" environment requires a reviewer.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: actions/download-artifact@v4
        with:
          name: packaged-prod.yaml

      - name: Assume the prod pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.PROD_REGION }}
          role-to-assume: ${{ env.PROD_PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Deploy to production account
        run: |
          sam deploy --stack-name ${PROD_STACK_NAME} \
            --config-env ${SAM_CONFIG_ENV} \
            --template packaged-prod.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${PROD_REGION} \
            --s3-bucket ${PROD_ARTIFACTS_BUCKET} \
            --parameter-overrides ${PROD_PARAMETERS} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --role-arn ${PROD_CLOUDFORMATION_EXECUTION_ROLE}
