AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless To-Do application with event-driven task expiry
  (Cognito, API Gateway, Lambda, DynamoDB, EventBridge Scheduler, SQS FIFO, SNS, Amplify).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage, used in resource names and the API stage.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for all Lambda log groups.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin allowed to call the API (set to the Amplify app URL once it exists).

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    CodeUri: backend
    MemorySize: 1024
    Timeout: 15
    Tracing: Active
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        STAGE: !Ref Stage
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1

Resources:
  # ---------------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------------
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  TaskNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-task-notifications
      DisplayName: To-Do Task Notifications

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # LambdaConfig (PreSignUp / PostAuthentication) is added by the Cognito
      # events on the trigger functions below.

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-pre-signup
      Description: Auto-confirms new users and verifies their email.
      Handler: com.todo.auth.PreSignUpHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref PreSignUpLogGroup
      Events:
        PreSignUp:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreSignUp

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-pre-signup
      RetentionInDays: !Ref LogRetentionDays

  PostAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-post-auth
      Description: Subscribes the authenticated user's email to the task notifications topic.
      Handler: com.todo.auth.PostAuthHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref PostAuthLogGroup
      Environment:
        Variables:
          TOPIC_ARN: !Ref TaskNotificationsTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref TaskNotificationsTopic
      Events:
        PostAuthentication:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostAuthentication

  PostAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-post-auth
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # REST API
  # ---------------------------------------------------------------------------
  # Region-wide setting that lets API Gateway write execution/access logs.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  TasksApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: !Ref LogRetentionDays

  TasksApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub ${AWS::StackName}-api
      StageName: !Ref Stage
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      # CORS headers on API Gateway-generated errors (e.g. 401 from the authorizer),
      # so the browser can read them.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: false
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
      AccessLogSetting:
        DestinationArn: !GetAtt TasksApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "user":"$context.authorizer.claims.sub","requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath",
          "status":"$context.status","responseLength":"$context.responseLength",
          "integrationLatency":"$context.integrationLatency","latency":"$context.responseLatency"}

  TasksApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-tasks-api
      Description: Task CRUD for the authenticated user.
      Handler: com.todo.api.TasksApiHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref TasksApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt TasksTable.Arn
                - !Sub ${TasksTable.Arn}/index/GSI1
      Events:
        ListTasks:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: GET
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: POST
        GetTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: GET
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: PUT
        DeleteTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: DELETE

  TasksApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-tasks-api
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Expiry scheduling: DynamoDB Stream -> StreamProcessor -> SQS FIFO ->
  #                    Scheduler fn -> EventBridge Scheduler -> Expiry fn
  # ---------------------------------------------------------------------------
  TaskEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-task-events.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      # >= 6x the consumer's timeout, as recommended for Lambda SQS event sources
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TaskEventsDlq.Arn
        maxReceiveCount: 5

  TaskEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-task-events-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Stream records the StreamProcessor could not forward after all retries.
  StreamFailuresDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-stream-failures-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Expiry invocations EventBridge Scheduler could not deliver after all retries.
  ExpiryDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-expiry-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TaskExpiryScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub ${AWS::StackName}-task-expiry

  # Assumed by EventBridge Scheduler to invoke the expiry function.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${TaskExpiryScheduleGroup}
      Policies:
        - PolicyName: invoke-expiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ExpiryFunction.Alias
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ExpiryDlq.Arn

  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-stream-processor
      Description: Turns task changes on the DynamoDB stream into SCHEDULE/CANCEL messages on the FIFO queue.
      Handler: com.todo.stream.StreamProcessorHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref StreamProcessorLogGroup
      Environment:
        Variables:
          TASK_EVENTS_QUEUE_URL: !Ref TaskEventsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource:
                - !GetAtt TaskEventsQueue.Arn
                - !GetAtt StreamFailuresDlq.Arn
      Events:
        TaskChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TasksTable.StreamArn
            # TRIM_HORIZON: a new or replaced mapping never skips records written while it
            # initialises; replays are harmless because the pipeline is idempotent.
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt StreamFailuresDlq.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"SK":{"S":[{"prefix":"TASK#"}]}}}}'

  StreamProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-stream-processor
      RetentionInDays: !Ref LogRetentionDays

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-scheduler
      Description: Creates/replaces or deletes each task's one-time EventBridge expiry schedule.
      Handler: com.todo.scheduler.SchedulerHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref SchedulerLogGroup
      Environment:
        Variables:
          SCHEDULE_GROUP_NAME: !Ref TaskExpiryScheduleGroup
          EXPIRY_FUNCTION_ARN: !Ref ExpiryFunction.Alias
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          EXPIRY_DLQ_ARN: !GetAtt ExpiryDlq.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${TaskExpiryScheduleGroup}/task-*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        TaskEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt TaskEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-scheduler
      RetentionInDays: !Ref LogRetentionDays

  ExpiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-expiry
      Description: At a task's deadline, marks it Expired (if still Pending) and emails the owner via SNS.
      Handler: com.todo.expiry.ExpiryHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref ExpiryLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
          TOPIC_ARN: !Ref TaskNotificationsTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt TasksTable.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref TaskNotificationsTopic

  ExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-expiry
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ApiUrl:
    Value: !Sub https://${TasksApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TasksTableName:
    Value: !Ref TasksTable
  TasksTableStreamArn:
    Value: !GetAtt TasksTable.StreamArn
  TaskNotificationsTopicArn:
    Value: !Ref TaskNotificationsTopic
