AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless To-Do application with event-driven task expiry
  (Cognito, API Gateway, Lambda, DynamoDB, EventBridge Scheduler, SQS FIFO, SNS, Amplify).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage, used in resource names and the API stage.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for all Lambda log groups.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin allowed to call the API (set to the Amplify app URL once it exists).
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to operational alarms (leave empty to skip).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    CodeUri: backend
    MemorySize: 1024
    Timeout: 15
    Tracing: Active
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        STAGE: !Ref Stage
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1

Resources:
  # ---------------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------------
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  TaskNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-task-notifications
      DisplayName: To-Do Task Notifications

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # LambdaConfig (PreSignUp / PostAuthentication) is added by the Cognito
      # events on the trigger functions below.

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-pre-signup
      Description: Auto-confirms new users and verifies their email.
      Handler: com.todo.auth.PreSignUpHandler::handleRequest
      Role: !GetAtt PreSignUpFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref PreSignUpLogGroup
      Events:
        PreSignUp:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreSignUp

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-pre-signup
      RetentionInDays: !Ref LogRetentionDays

  PostAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-post-auth
      Description: Subscribes the authenticated user's email to the task notifications topic.
      Handler: com.todo.auth.PostAuthHandler::handleRequest
      Role: !GetAtt PostAuthFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref PostAuthLogGroup
      Environment:
        Variables:
          TOPIC_ARN: !Ref TaskNotificationsTopic
      Events:
        PostAuthentication:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostAuthentication

  PostAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-post-auth
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # REST API
  # ---------------------------------------------------------------------------
  # Region-wide setting that lets API Gateway write execution/access logs.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  TasksApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: !Ref LogRetentionDays

  TasksApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub ${AWS::StackName}-api
      StageName: !Ref Stage
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      # CORS headers on API Gateway-generated errors (e.g. 401 from the authorizer),
      # so the browser can read them.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: false
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
      AccessLogSetting:
        DestinationArn: !GetAtt TasksApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "user":"$context.authorizer.claims.sub","requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath",
          "status":"$context.status","responseLength":"$context.responseLength",
          "integrationLatency":"$context.integrationLatency","latency":"$context.responseLatency"}

  TasksApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-tasks-api
      Description: Task CRUD for the authenticated user.
      Handler: com.todo.api.TasksApiHandler::handleRequest
      Role: !GetAtt TasksApiFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref TasksApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        ListTasks:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: GET
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: POST
        GetTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: GET
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: PUT
        DeleteTask:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: DELETE

  TasksApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-tasks-api
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Expiry scheduling: DynamoDB Stream -> StreamProcessor -> SQS FIFO ->
  #                    Scheduler fn -> EventBridge Scheduler -> Expiry fn
  # ---------------------------------------------------------------------------
  TaskEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-task-events.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      # >= 6x the consumer's timeout, as recommended for Lambda SQS event sources
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TaskEventsDlq.Arn
        maxReceiveCount: 5

  TaskEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-task-events-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Stream records the StreamProcessor could not forward after all retries.
  StreamFailuresDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-stream-failures-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Expiry invocations EventBridge Scheduler could not deliver after all retries.
  ExpiryDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-expiry-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TaskExpiryScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub ${AWS::StackName}-task-expiry

  # Assumed by EventBridge Scheduler to invoke the expiry function.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${TaskExpiryScheduleGroup}
      Policies:
        - PolicyName: invoke-expiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ExpiryFunction.Alias
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ExpiryDlq.Arn

  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-stream-processor
      Description: Turns task changes on the DynamoDB stream into SCHEDULE/CANCEL messages on the FIFO queue.
      Handler: com.todo.stream.StreamProcessorHandler::handleRequest
      Role: !GetAtt StreamProcessorFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref StreamProcessorLogGroup
      Environment:
        Variables:
          TASK_EVENTS_QUEUE_URL: !Ref TaskEventsQueue
      Events:
        TaskChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TasksTable.StreamArn
            # TRIM_HORIZON: a new or replaced mapping never skips records written while it
            # initialises; replays are harmless because the pipeline is idempotent.
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt StreamFailuresDlq.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"SK":{"S":[{"prefix":"TASK#"}]}}}}'

  StreamProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-stream-processor
      RetentionInDays: !Ref LogRetentionDays

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-scheduler
      Description: Creates/replaces or deletes each task's one-time EventBridge expiry schedule.
      Handler: com.todo.scheduler.SchedulerHandler::handleRequest
      Role: !GetAtt SchedulerFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref SchedulerLogGroup
      Environment:
        Variables:
          SCHEDULE_GROUP_NAME: !Ref TaskExpiryScheduleGroup
          EXPIRY_FUNCTION_ARN: !Ref ExpiryFunction.Alias
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          EXPIRY_DLQ_ARN: !GetAtt ExpiryDlq.Arn
      Events:
        TaskEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt TaskEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-scheduler
      RetentionInDays: !Ref LogRetentionDays

  ExpiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-expiry
      Description: At a task's deadline, marks it Expired (if still Pending) and emails the owner via SNS.
      Handler: com.todo.expiry.ExpiryHandler::handleRequest
      Role: !GetAtt ExpiryFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref ExpiryLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
          TOPIC_ARN: !Ref TaskNotificationsTopic

  ExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-expiry
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # IAM: one least-privilege role per function. Explicit roles replace the broad
  # AWS managed policies SAM would attach (logs on *, SQS on *, streams on *).
  # X-Ray actions do not support resource-level permissions, hence "*".
  # ---------------------------------------------------------------------------
  PreSignUpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pre-signup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PreSignUpLogGroup.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'

  PostAuthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: post-auth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PostAuthLogGroup.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'
              - Effect: Allow
                Action: sns:Subscribe
                Resource: !Ref TaskNotificationsTopic
                Condition:
                  StringEquals:
                    sns:Protocol: email

  TasksApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tasks-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TasksApiLogGroup.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TasksTable.Arn
                  - !Sub ${TasksTable.Arn}/index/GSI1

  StreamProcessorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: stream-processor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt StreamProcessorLogGroup.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !Sub ${TasksTable.Arn}/stream/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt TaskEventsQueue.Arn
                  - !GetAtt StreamFailuresDlq.Arn

  SchedulerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scheduler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SchedulerLogGroup.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt TaskEventsQueue.Arn
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${TaskExpiryScheduleGroup}/task-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerInvokeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  ExpiryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: expiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ExpiryLogGroup.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt TasksTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref TaskNotificationsTopic

  # ---------------------------------------------------------------------------
  # Observability: business metrics from structured logs, alarms, dashboard
  # ---------------------------------------------------------------------------
  TasksExpiredMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ExpiryLogGroup
      FilterPattern: '{ $.message = "Expired task*" }'
      MetricTransformations:
        - MetricNamespace: !Sub ServerlessTodo/${Stage}
          MetricName: TasksExpired
          MetricValue: '1'
          Unit: Count

  ExpiryNotificationsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ExpiryLogGroup
      FilterPattern: '{ $.message = "Notified owner*" }'
      MetricTransformations:
        - MetricNamespace: !Sub ServerlessTodo/${Stage}
          MetricName: ExpiryNotificationsSent
          MetricValue: '1'
          Unit: Count

  SchedulesCreatedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SchedulerLogGroup
      FilterPattern: '{ ($.message = "Created schedule*") || ($.message = "Updated schedule*") }'
      MetricTransformations:
        - MetricNamespace: !Sub ServerlessTodo/${Stage}
          MetricName: SchedulesCreated
          MetricValue: '1'
          Unit: Count

  SchedulesCancelledMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SchedulerLogGroup
      FilterPattern: '{ $.message = "Cancelled schedule*" }'
      MetricTransformations:
        - MetricNamespace: !Sub ServerlessTodo/${Stage}
          MetricName: SchedulesCancelled
          MetricValue: '1'
          Unit: Count

  OpsAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-ops-alarms
      DisplayName: To-Do Ops Alarms

  OpsAlarmsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref OpsAlarmsTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-lambda-errors
      AlarmDescription: One or more Lambda functions returned errors.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlarmsTopic]
      OKActions: [!Ref OpsAlarmsTopic]
      Metrics:
        - Id: total
          Expression: SUM([e1, e2, e3, e4, e5, e6])
          Label: Total Lambda errors
        - Id: e1
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref PreSignUpFunction}]}, Period: 300, Stat: Sum}
        - Id: e2
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref PostAuthFunction}]}, Period: 300, Stat: Sum}
        - Id: e3
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref TasksApiFunction}]}, Period: 300, Stat: Sum}
        - Id: e4
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref StreamProcessorFunction}]}, Period: 300, Stat: Sum}
        - Id: e5
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref SchedulerFunction}]}, Period: 300, Stat: Sum}
        - Id: e6
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref ExpiryFunction}]}, Period: 300, Stat: Sum}

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: The tasks API returned 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ${AWS::StackName}-api
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlarmsTopic]
      OKActions: [!Ref OpsAlarmsTopic]

  DeadLetterMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dead-letters
      AlarmDescription: Messages landed in a dead-letter queue (task events, stream failures or expiry delivery).
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlarmsTopic]
      OKActions: [!Ref OpsAlarmsTopic]
      Metrics:
        - Id: total
          Expression: SUM([d1, d2, d3])
          Label: Dead-lettered messages
        - Id: d1
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{Name: QueueName, Value: !GetAtt TaskEventsDlq.QueueName}]}, Period: 60, Stat: Maximum}
        - Id: d2
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{Name: QueueName, Value: !GetAtt StreamFailuresDlq.QueueName}]}, Period: 60, Stat: Maximum}
        - Id: d3
          ReturnData: false
          MetricStat: {Metric: {Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{Name: QueueName, Value: !GetAtt ExpiryDlq.QueueName}]}, Period: 60, Stat: Maximum}

  TaskEventsBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-task-events-backlog
      AlarmDescription: Task events are waiting more than 5 minutes; schedules may be created or cancelled late.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TaskEventsQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlarmsTopic]
      OKActions: [!Ref OpsAlarmsTopic]

  StreamIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-stream-lag
      AlarmDescription: The stream processor is more than a minute behind the tasks table stream.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref StreamProcessorFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlarmsTopic]
      OKActions: [!Ref OpsAlarmsTopic]

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-operations
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "alarm", "x": 0, "y": 0, "width": 24, "height": 3,
               "properties": {"title": "Alarms", "alarms": [
                 "${LambdaErrorsAlarm.Arn}", "${ApiServerErrorsAlarm.Arn}", "${DeadLetterMessagesAlarm.Arn}",
                 "${TaskEventsBacklogAlarm.Arn}", "${StreamIteratorAgeAlarm.Arn}"]}},

              {"type": "metric", "x": 0, "y": 3, "width": 12, "height": 6,
               "properties": {"title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                 "metrics": [
                   ["AWS/ApiGateway", "Count", "ApiName", "${ApiName}", "Stage", "${Stage}"],
                   [".", "4XXError", ".", ".", ".", "."],
                   [".", "5XXError", ".", ".", ".", "."]]}},
              {"type": "metric", "x": 12, "y": 3, "width": 12, "height": 6,
               "properties": {"title": "API latency (ms)", "region": "${AWS::Region}", "period": 60,
                 "metrics": [
                   ["AWS/ApiGateway", "Latency", "ApiName", "${ApiName}", "Stage", "${Stage}", {"stat": "p50"}],
                   ["...", {"stat": "p95"}],
                   [".", "IntegrationLatency", ".", ".", ".", ".", {"stat": "p95"}]]}},

              {"type": "metric", "x": 0, "y": 9, "width": 12, "height": 6,
               "properties": {"title": "Task lifecycle", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                 "metrics": [
                   ["ServerlessTodo/${Stage}", "SchedulesCreated"],
                   [".", "SchedulesCancelled"],
                   [".", "TasksExpired"],
                   [".", "ExpiryNotificationsSent"]]}},
              {"type": "metric", "x": 12, "y": 9, "width": 12, "height": 6,
               "properties": {"title": "Expiry pipeline health", "region": "${AWS::Region}", "period": 60,
                 "metrics": [
                   ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${TaskEventsQueue.QueueName}", {"stat": "Maximum", "label": "Task events waiting"}],
                   [".", "ApproximateAgeOfOldestMessage", ".", ".", {"stat": "Maximum", "label": "Oldest task event (s)", "yAxis": "right"}],
                   [".", "ApproximateNumberOfMessagesVisible", ".", "${TaskEventsDlq.QueueName}", {"stat": "Maximum", "label": "Task events DLQ"}],
                   ["...", "${StreamFailuresDlq.QueueName}", {"stat": "Maximum", "label": "Stream failures DLQ"}],
                   ["...", "${ExpiryDlq.QueueName}", {"stat": "Maximum", "label": "Expiry DLQ"}],
                   ["AWS/Lambda", "IteratorAge", "FunctionName", "${StreamProcessorFunction}", {"stat": "Maximum", "label": "Stream lag (ms)", "yAxis": "right"}]]}},

              {"type": "metric", "x": 0, "y": 15, "width": 8, "height": 6,
               "properties": {"title": "Lambda invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                 "metrics": [
                   ["AWS/Lambda", "Invocations", "FunctionName", "${TasksApiFunction}"],
                   ["...", "${StreamProcessorFunction}"],
                   ["...", "${SchedulerFunction}"],
                   ["...", "${ExpiryFunction}"],
                   ["...", "${PreSignUpFunction}"],
                   ["...", "${PostAuthFunction}"]]}},
              {"type": "metric", "x": 8, "y": 15, "width": 8, "height": 6,
               "properties": {"title": "Lambda errors and throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                 "metrics": [
                   ["AWS/Lambda", "Errors", "FunctionName", "${TasksApiFunction}"],
                   ["...", "${StreamProcessorFunction}"],
                   ["...", "${SchedulerFunction}"],
                   ["...", "${ExpiryFunction}"],
                   ["...", "${PreSignUpFunction}"],
                   ["...", "${PostAuthFunction}"],
                   [".", "Throttles", ".", "${TasksApiFunction}"]]}},
              {"type": "metric", "x": 16, "y": 15, "width": 8, "height": 6,
               "properties": {"title": "Lambda duration p95 (ms)", "region": "${AWS::Region}", "stat": "p95", "period": 60,
                 "metrics": [
                   ["AWS/Lambda", "Duration", "FunctionName", "${TasksApiFunction}"],
                   ["...", "${StreamProcessorFunction}"],
                   ["...", "${SchedulerFunction}"],
                   ["...", "${ExpiryFunction}"],
                   ["...", "${PostAuthFunction}"]]}},

              {"type": "metric", "x": 0, "y": 21, "width": 12, "height": 6,
               "properties": {"title": "DynamoDB capacity", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                 "metrics": [
                   ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TasksTable}"],
                   [".", "ConsumedWriteCapacityUnits", ".", "."]]}},
              {"type": "metric", "x": 12, "y": 21, "width": 12, "height": 6,
               "properties": {"title": "DynamoDB throttles and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                 "metrics": [
                   ["AWS/DynamoDB", "ThrottledRequests", "TableName", "${TasksTable}", "Operation", "PutItem"],
                   ["...", "Query"],
                   ["...", "UpdateItem"],
                   [".", "SystemErrors", ".", ".", ".", "PutItem"]]}}
            ]
          }
        - ApiName: !Sub ${AWS::StackName}-api

Outputs:
  OperationsDashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-operations
  OpsAlarmsTopicArn:
    Value: !Ref OpsAlarmsTopic
  ApiUrl:
    Value: !Sub https://${TasksApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TasksTableName:
    Value: !Ref TasksTable
  TasksTableStreamArn:
    Value: !GetAtt TasksTable.StreamArn
  TaskNotificationsTopicArn:
    Value: !Ref TaskNotificationsTopic
